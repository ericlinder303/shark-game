<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover + user-scalable=no keeps it app-like on iOS later -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#08303f" />
  <title>Cage &amp; Tide — Fishing Game</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app"></div>

  <!-- Plain (non-module) scripts so the game runs by just opening this file.
       Load order matters: data -> sprites -> fishing -> game. -->
  <script src="js/data.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fishing.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
